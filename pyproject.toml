[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morpheus-lab"
version = "0.3.0"
description = "A laboratory for anatomical self-models: regenerating tissues, bioelectric memory and audited self-improvement"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kai Piper"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
morpheus = "morpheus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
