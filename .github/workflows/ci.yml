name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e ".[test]"
      - name: unit tests (gradient check, JS/Python parity, statistics)
        run: python -m pytest -q
      - name: every number in the README is checked against the results files
        run: morpheus claims check
